  <script>
  document.addEventListener("DOMContentLoaded", function () {
    const links = document.querySelectorAll('.lightbox');
    const overlay = document.createElement('div');
    overlay.className = 'lightbox-overlay';
    overlay.innerHTML = '<img><span style="position:absolute;top:20px;right:30px;color:white;font-size:2rem;cursor:pointer;">&times;</span>';
    document.body.appendChild(overlay);

    const img = overlay.querySelector('img');
    const close = overlay.querySelector('span');

    links.forEach(link => {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        img.src = this.href;
        overlay.classList.add('active');
      });
    });

    overlay.addEventListener('click', () => overlay.classList.remove('active'));
    close.addEventListener('click', () => overlay.classList.remove('active'));
  });
</script>
